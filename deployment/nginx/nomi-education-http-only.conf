# Temporary HTTP-only nginx configuration
# Use this FIRST to get SSL certificates, then switch to the full config

# Upstream backend service
upstream nomi_backend {
    server 127.0.0.1:5000 fail_timeout=10s max_fails=3;
    keepalive 32;
}

# Upstream frontend service
upstream nomi_frontend {
    server 127.0.0.1:3000 fail_timeout=10s max_fails=3;
    keepalive 32;
}

# HTTP server for both domains
server {
    listen 80;
    listen [::]:80;
    server_name learnerspreschool.cloud be.learnerspreschool.cloud;

    # Allow Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Logging
    access_log /var/log/nginx/nomi-education.access.log;
    error_log /var/log/nginx/nomi-education.error.log warn;

    # Client upload size
    client_max_body_size 10M;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https:; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: http: https:; font-src 'self' data:; connect-src 'self' http://learnerspreschool.cloud http://be.learnerspreschool.cloud https://learnerspreschool.cloud https://be.learnerspreschool.cloud https://graph.microsoft.com https://login.microsoftonline.com;" always;

    # Backend API proxy
    location /api/ {
        proxy_pass http://nomi_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Frontend application
    location / {
        proxy_pass http://nomi_frontend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
