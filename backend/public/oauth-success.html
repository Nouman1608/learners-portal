<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication Successful</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
        }

        .container {
            text-align: center;
            padding: 2rem;
            max-width: 500px;
        }

        .success-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 1.5rem;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: scaleIn 0.5s ease-out;
        }

        .success-icon svg {
            width: 50px;
            height: 50px;
            stroke: #fff;
            stroke-width: 3;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 1rem;
            font-weight: 600;
            animation: fadeIn 0.5s ease-out 0.2s both;
        }

        p {
            font-size: 1.125rem;
            opacity: 0.9;
            margin-bottom: 2rem;
            animation: fadeIn 0.5s ease-out 0.4s both;
        }

        .close-button {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.5);
            color: #fff;
            padding: 0.75rem 2rem;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            animation: fadeIn 0.5s ease-out 0.6s both;
        }

        .close-button:hover {
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.8);
            transform: translateY(-2px);
        }

        @keyframes scaleIn {
            from {
                transform: scale(0);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .error-container {
            background: rgba(239, 68, 68, 0.2);
            border: 2px solid rgba(239, 68, 68, 0.5);
            border-radius: 12px;
            padding: 1.5rem;
            margin-top: 1rem;
            animation: fadeIn 0.5s ease-out 0.3s both;
        }

        .error-text {
            margin: 0;
            font-size: 0.875rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="success-icon" id="icon">
            <svg viewBox="0 0 52 52">
                <path d="M14 27l10 10 20-20" />
            </svg>
        </div>
        <h1 id="title">Authentication Successful!</h1>
        <p id="message">Your Microsoft Teams account has been connected successfully.</p>
        <div id="error-container" style="display: none;" class="error-container">
            <p class="error-text" id="error-message"></p>
        </div>
        <button class="close-button" onclick="closeWindow()">Close This Window</button>
    </div>

    <script>
        // Parse URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const error = urlParams.get('error');
        const errorDescription = urlParams.get('error_description');

        // Handle error state
        if (error) {
            document.getElementById('icon').innerHTML = '<svg viewBox="0 0 52 52"><path d="M16 16l20 20M36 16l-20 20" /></svg>';
            document.getElementById('title').textContent = 'Authentication Failed';
            document.getElementById('message').textContent = 'There was an error connecting your Microsoft Teams account.';

            if (errorDescription) {
                document.getElementById('error-container').style.display = 'block';
                document.getElementById('error-message').textContent = decodeURIComponent(errorDescription);
            }
        } else {
            // Auto-close after 3 seconds on success
            setTimeout(() => {
                closeWindow();
            }, 3000);
        }

        function closeWindow() {
            // Try to close the window
            window.close();

            // If window.close() doesn't work (some browsers block it),
            // show a message
            setTimeout(() => {
                if (!window.closed) {
                    document.getElementById('message').textContent = 'Please close this window manually.';
                }
            }, 500);
        }

        // Also send message to parent window if opened as popup
        if (window.opener) {
            window.opener.postMessage(
                {
                    type: 'oauth-complete',
                    success: !error,
                    error: error || null
                },
                window.location.origin
            );
        }
    </script>
</body>
</html>
